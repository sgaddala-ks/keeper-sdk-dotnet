name: Publish PowerCommander

on: [workflow_dispatch]

jobs:
  publish:
    runs-on: windows-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up certificate
        shell: bash
        run: |
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12

      - name: Configure signing environment
        shell: bash
        run: |
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=D:/Certificate_pkcs12.p12" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          echo "C:\Program Files (x86)\Windows Kits\10\App Certification Kit" >> $GITHUB_PATH
          echo "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools" >> $GITHUB_PATH
          echo "C:\Program Files\DigiCert\DigiCert One Signing Manager Tools" >> $GITHUB_PATH

      - name: Setup DigiCert SSM Tools
        uses: digicert/ssm-code-signing@b300bb7e8c2ab85257d660fe5b6c6374131ca2ef

      - name: Sync Certificates
        shell: cmd
        env:
          KEYPAIR_ALIAS: ${{ secrets.KEYPAIR_ALIAS }}
        run: |
          smctl healthcheck
          smctl windows certsync --keypair-alias=%KEYPAIR_ALIAS%

      - name: Restore solution
        run: dotnet restore KeeperSdk.sln
        shell: powershell

      - name: Build PowerCommander Storage Utils
        working-directory: ./PowerCommanderStorageUtils
        run: |
          if (Test-Path bin) { Remove-Item -Force -Recurse bin }
          dotnet build --configuration=Release -r win-x64
          $dll = "bin\Release\net8.0\win-x64\PowerCommanderStorageUtils.dll"
          if (-not (Test-Path -LiteralPath $dll)) { throw "Expected build output not found: $dll" }
          & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/signtool.exe' sign /debug /v /sha1 ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }} /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /d ".NET Keeper SDK" $dll
        shell: powershell

      - name: Copy StorageUtils into PowerCommander module
        run: |
          # Same file set as PowerCommander/AuthCommands.ps1 ($requiredStorageDlls + e_sqlite3.dll on Windows)
          $buildOutput = Resolve-Path "PowerCommanderStorageUtils/bin/Release/net8.0/win-x64"
          $destRoot = Join-Path $PWD "PowerCommander/StorageUtils"
          if (Test-Path $destRoot) { Remove-Item -Force -Recurse $destRoot }
          New-Item -ItemType Directory -Path $destRoot -Force | Out-Null
          $requiredManagedFiles = @(
            "PowerCommanderStorageUtils.dll",
            "Microsoft.Data.Sqlite.dll",
            "SQLitePCLRaw.batteries_v2.dll",
            "SQLitePCLRaw.core.dll",
            "SQLitePCLRaw.provider.e_sqlite3.dll"
          )
          foreach ($fileName in $requiredManagedFiles) {
            $sourcePath = Join-Path $buildOutput $fileName
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Required file not found: $sourcePath"
            }
            Copy-Item -LiteralPath $sourcePath -Destination $destRoot -Force
          }
          $nativeCandidates = @(
            (Join-Path $buildOutput "e_sqlite3.dll"),
            (Join-Path $buildOutput "runtimes/win-x64/native/e_sqlite3.dll")
          )
          $nativePath = $nativeCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nativePath) {
            throw "Native e_sqlite3.dll not found. Checked: $($nativeCandidates -join ', ')"
          }
          Copy-Item -LiteralPath $nativePath -Destination (Join-Path $destRoot "e_sqlite3.dll") -Force
        shell: powershell

      - name: Sign PowerShell scripts
        working-directory: ./PowerCommander
        run: |
          $cert = Get-ChildItem -Path Cert:\CurrentUser\My\${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }} -CodeSigningCert
          Set-AuthenticodeSignature -FilePath *.ps1 -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          Set-AuthenticodeSignature -FilePath *.ps1xml -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          Set-AuthenticodeSignature -FilePath PowerCommander.psd1 -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          Set-AuthenticodeSignature -FilePath PowerCommander.psm1 -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
        shell: powershell

      # - name: Publish to PowerShell Gallery
      #   run: |
      #     Publish-Module -Path .\PowerCommander\ -NuGetApiKey "${{ secrets.POWERSHELL_PUBLISH_KEY }}"
      #   shell: powershell
